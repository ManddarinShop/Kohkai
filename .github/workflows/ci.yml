name: Kohkai CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, build, parity, and packed consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime-neutral source boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'node:|@mikro-orm|googleapis' src --include='*.ts'; then
            echo "Kohkai source must not depend on platform or provider packages" >&2
            exit 1
          fi

      - name: Typecheck source
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Run unit, malformed-input, golden-vector, and Apps Script parity tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package tarball boundary
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/kohkai-pack.json"
          node -e '
            const record = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0];
            const pkg = require("./package.json");
            if (record.name !== pkg.name || record.version !== pkg.version) process.exit(1);
            const files = record.files.map((entry) => entry.path);
            if (!files.includes("dist/index.js") || !files.includes("dist/index.d.ts")) process.exit(1);
            if (files.some((file) => /^(src|test|apps-script)\//.test(file))) process.exit(1);
          ' "$RUNNER_TEMP/kohkai-pack.json"

      - name: Run packed consumer smoke
        run: npm run smoke:packed-consumer
